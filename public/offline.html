<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Solomon Islands Arts & Crafts</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #FFFFFF;
      color: #3D362E;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1B3A4B;
      padding: 1rem 1.5rem;
    }
    header h1 {
      color: #FFFFFF;
      font-size: 1.125rem;
      font-weight: 500;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .offline-content h2 {
      font-size: 1.5rem;
      color: #1B3A4B;
      margin-bottom: 1rem;
    }
    .offline-content p {
      font-size: 1rem;
      line-height: 1.6;
      color: #5C5648;
      max-width: 400px;
      margin: 0 auto;
    }
    .retry-btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.75rem 1.5rem;
      background: #1E7A3D;
      color: #FFFFFF;
      border: none;
      border-radius: 0.375rem;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      min-height: 44px;
      min-width: 44px;
    }
    .retry-btn:hover { background: #166B30; }
    .retry-btn:focus {
      outline: 2px solid #1E5AA8;
      outline-offset: 2px;
    }
    footer {
      background: #1B3A4B;
      padding: 1rem 1.5rem;
      text-align: center;
    }
    footer p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Solomon Islands Arts & Crafts</h1>
  </header>
  <main>
    <div class="offline-content">
      <h2>You are offline</h2>
      <p>
        It looks like your internet connection is unavailable.
        Please check your connection and try again.
      </p>
      <button class="retry-btn" onclick="window.location.reload()">
        Try again
      </button>
    </div>
  </main>
  <footer>
    <p>&copy; Solomon Islands Arts & Crafts</p>
  </footer>
</body>
</html>

# Render Blueprint — SI Crafts Django/Wagtail Backend
# https://render.com/docs/blueprint-spec

databases:
  - name: siac-db
    plan: free
    databaseName: siac
    user: siac

services:
  - type: web
    name: si-crafts
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: siac-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      # Browser-side calls (the admin dashboard) are subject to CORS, so every
      # origin that serves the front end must be listed here — including
      # http://localhost:3000 so local dev can read/write the live data.
      #
      # The Worker is published on the *siacrafts* workers.dev subdomain. An
      # earlier value here named an "isaactekulu" subdomain that returns 404 on
      # every path; it was corrected in the Render dashboard but not in this
      # file, so a blueprint sync would have reverted production to the dead
      # origin and blocked the admin dashboard on CORS.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://si-crafts.siacrafts.workers.dev,https://solomonislandsartsandcrafts.com.au,https://www.solomonislandsartsandcrafts.com.au,http://localhost:3000"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://si-crafts-iwcd.onrender.com,https://si-crafts.siacrafts.workers.dev,https://solomonislandsartsandcrafts.com.au,https://www.solomonislandsartsandcrafts.com.au"
      # SITE_URL is not cosmetic: notifications/emails.py builds the stockist
      # set-password and password-reset links from it. Pointing it at a host
      # that 404s ships dead links in every approval and reset email.
      - key: FRONTEND_URL
        value: "https://si-crafts.siacrafts.workers.dev"
      - key: SITE_URL
        value: "https://si-crafts.siacrafts.workers.dev"
      - key: PYTHON_VERSION
        value: "3.12.2"
      # Must be this service's own hostname — Wagtail builds absolute image and
      # notification URLs from it. "si-crafts.onrender.com" (without the -iwcd
      # suffix Render assigned) 404s.
      - key: WAGTAILADMIN_BASE_URL
        value: "https://si-crafts-iwcd.onrender.com"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: "si-crafts-media"
      - key: R2_PUBLIC_URL
        sync: false

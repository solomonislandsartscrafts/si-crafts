# Render Blueprint — SI Crafts Django/Wagtail Backend
# https://render.com/docs/blueprint-spec

databases:
  - name: siac-db
    plan: free
    databaseName: siac
    user: siac

services:
  - type: web
    name: si-crafts
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: siac-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      # Browser-side calls (the admin dashboard) are subject to CORS, so every
      # origin that serves the front end must be listed here — including
      # http://localhost:3000 so local dev can read/write the live data.
      #
      # The Worker is published on the *siacrafts* workers.dev subdomain. An
      # earlier value here named an "isaactekulu" subdomain that returns 404 on
      # every path; it was corrected in the Render dashboard but not in this
      # file, so a blueprint sync would have reverted production to the dead
      # origin and blocked the admin dashboard on CORS.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://si-crafts.siacrafts.workers.dev,https://solomonislandsartscrafts.com.au,https://www.solomonislandsartscrafts.com.au,http://localhost:3000"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://si-crafts-iwcd.onrender.com,https://si-crafts.siacrafts.workers.dev,https://solomonislandsartscrafts.com.au,https://www.solomonislandsartscrafts.com.au"
      # SITE_URL is not cosmetic: notifications/emails.py builds the stockist
      # set-password and password-reset links from it. Pointing it at a host
      # that 404s ships dead links in every approval and reset email.
      - key: FRONTEND_URL
        value: "https://solomonislandsartscrafts.com.au"
      - key: SITE_URL
        value: "https://solomonislandsartscrafts.com.au"
      - key: PYTHON_VERSION
        value: "3.12.2"
      # Must be this service's own hostname — Wagtail builds absolute image and
      # notification URLs from it. "si-crafts.onrender.com" (without the -iwcd
      # suffix Render assigned) 404s.
      - key: WAGTAILADMIN_BASE_URL
        value: "https://si-crafts-iwcd.onrender.com"
      # Email is sent via the Resend HTTP API (port 443). Render's free plan
      # blocks outbound SMTP ports (25/465/587), so SMTP can never connect from
      # here — settings.py auto-selects the Resend backend when RESEND_API_KEY
      # is present. Do NOT set EMAIL_BACKEND here, or it overrides that choice.
      - key: RESEND_API_KEY
        sync: false
      # From address for all outgoing mail. Must be an address on a domain you
      # have verified in Resend (e.g. noreply@solomonislandsartscrafts.com.au).
      # Until the domain is verified, only Resend's onboarding@resend.dev works.
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Where admin notifications (new stockist application, new order, contact
      # message) land. _get_admin_emails() prefers active Super Admin account
      # emails and only falls back to this — but that fallback matters: if no
      # active Super Admin has an email set, without this every admin
      # notification goes to the no-reply From address, which nobody monitors.
      # Set this to a real, monitored inbox so notifications can never be lost.
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: "si-crafts-media"
      - key: R2_PUBLIC_URL
        sync: false

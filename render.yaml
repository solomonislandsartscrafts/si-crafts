# Render Blueprint — SI Crafts Django/Wagtail Backend
# https://render.com/docs/blueprint-spec

databases:
  - name: siac-db
    plan: free
    databaseName: siac
    user: siac

services:
  - type: web
    name: si-crafts
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: siac-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      # Browser-side calls (the admin dashboard) are subject to CORS, so every
      # origin that serves the front end must be listed here — including
      # http://localhost:3000 so local dev can read/write the live data.
      #
      # The Worker is published on the *siacrafts* workers.dev subdomain. An
      # earlier value here named an "isaactekulu" subdomain that returns 404 on
      # every path; it was corrected in the Render dashboard but not in this
      # file, so a blueprint sync would have reverted production to the dead
      # origin and blocked the admin dashboard on CORS.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://si-crafts.siacrafts.workers.dev,https://solomonislandsartsandcrafts.com.au,https://www.solomonislandsartsandcrafts.com.au,http://localhost:3000"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://si-crafts-iwcd.onrender.com,https://si-crafts.siacrafts.workers.dev,https://solomonislandsartsandcrafts.com.au,https://www.solomonislandsartsandcrafts.com.au"
      # SITE_URL is not cosmetic: notifications/emails.py builds the stockist
      # set-password and password-reset links from it. Pointing it at a host
      # that 404s ships dead links in every approval and reset email.
      - key: FRONTEND_URL
        value: "https://si-crafts.siacrafts.workers.dev"
      - key: SITE_URL
        value: "https://si-crafts.siacrafts.workers.dev"
      - key: PYTHON_VERSION
        value: "3.12.2"
      # Must be this service's own hostname — Wagtail builds absolute image and
      # notification URLs from it. "si-crafts.onrender.com" (without the -iwcd
      # suffix Render assigned) 404s.
      - key: WAGTAILADMIN_BASE_URL
        value: "https://si-crafts-iwcd.onrender.com"
      # Email goes out over Resend's HTTP API, NOT SMTP.
      #
      # Render's free plan blocks outbound traffic to SMTP ports (25/465/587),
      # so Gmail SMTP cannot deliver from here: the connection to
      # smtp.gmail.com is dropped silently rather than refused, the send hangs,
      # gunicorn kills the worker at 30s, and the visitor gets a 500 on a
      # contact form that had already saved. Resend is HTTPS on 443, which is
      # not blocked. Do not "restore" the SMTP backend here without also moving
      # this service to a paid instance type.
      #
      # DEFAULT_FROM_EMAIL must use a domain verified in the Resend dashboard,
      # or Resend rejects the send with a 403.
      - key: EMAIL_BACKEND
        value: "apps.notifications.email_backends.ResendEmailBackend"
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: "si-crafts-media"
      - key: R2_PUBLIC_URL
        sync: false

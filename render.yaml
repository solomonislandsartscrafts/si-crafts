# Render Blueprint — SI Crafts Django/Wagtail Backend
# https://render.com/docs/blueprint-spec

databases:
  - name: siac-db
    plan: free
    databaseName: siac
    user: siac

services:
  - type: web
    name: si-crafts
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: siac-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://si-crafts.isaactekulu.workers.dev"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://si-crafts.onrender.com,https://si-crafts.isaactekulu.workers.dev"
      - key: FRONTEND_URL
        value: "https://si-crafts.isaactekulu.workers.dev"
      - key: SITE_URL
        value: "https://si-crafts.isaactekulu.workers.dev"
      - key: PYTHON_VERSION
        value: "3.12.2"
      - key: WAGTAILADMIN_BASE_URL
        value: "https://si-crafts.onrender.com"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: "si-crafts-media"
      - key: R2_PUBLIC_URL
        sync: false
